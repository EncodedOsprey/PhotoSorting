name: CI

on:
  push:
    paths:
      - 'PhotoSorting/**'
      - 'PhotoSortingCore/**'
      - 'PhotoSorting.xcodeproj/**'
      - 'project.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'PhotoSorting/**'
      - 'PhotoSortingCore/**'
      - 'PhotoSorting.xcodeproj/**'
      - 'project.yml'
      - '.github/workflows/ci.yml'

jobs:
  core-tests:
    name: PhotoSortingCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        working-directory: PhotoSortingCore
        run: swift test

  ios-build:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoSorting.xcodeproj \
            -scheme PhotoSorting \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
