name: PhotoSorting

options:
  bundleIdPrefix: com.encodedosprey
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

packages:
  PhotoSortingCore:
    path: PhotoSortingCore

targets:
  PhotoSorting:
    type: application
    platform: iOS
    sources:
      - path: PhotoSorting
    dependencies:
      - package: PhotoSortingCore
        product: PhotoSortingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.encodedosprey.PhotoSorting
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PhotoSorting analyzes the photos from your shoot on this iPhone to pick the best ones. Photos never leave your device."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PhotoSorting saves your selected photos into a new album."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: PhotoSorting
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  PhotoSorting:
    build:
      targets:
        PhotoSorting: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PhotoSortingCore/PhotoSortingCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
